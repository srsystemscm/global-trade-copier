name: CI

# On pull requests, and on master itself. Deliberately not on every push to
# every branch: the pull_request trigger already covers a branch that has one
# open, and running both would double the minutes for no extra information.
on:
  push:
    branches: [master]
  pull_request:
  # For the upgrade canary below, which is the only job these reach. Monday
  # morning, so a week's worth of releases has landed and there is a working
  # week to deal with whatever it says.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless, so
# cancel it rather than paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hub:
    name: hub tests
    # Windows, because that is where this runs. The copier lives on a Windows
    # VPS -- zmq.asyncio needs WindowsSelectorEventLoopPolicy there, MT4/MT5
    # terminals exist nowhere else, and the suite is only known to pass on
    # it. A green badge from Linux would be testing a platform nobody
    # deploys to, which is worse than no badge.
    runs-on: windows-latest
    # The suite is ~3.5 minutes locally and does real socket work against
    # loopback stubs. Twenty is room to spare without a hung job burning an
    # hour of minutes.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to what the venv on the VPS runs. A trading system is not
          # the place to discover a minor-version behaviour change from CI.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            hub/requirements.txt
            hub/requirements-dev.txt
            hub/constraints.txt

      - name: Install dependencies
        working-directory: hub
        # Both files. requirements.txt is what a hub installs, where the
        # IBKR client library is optional on purpose -- the adapter
        # lazy-imports it, so a deployment with no IBKR slave does not need
        # it. requirements-dev.txt is what the SUITE needs, which is not the
        # same thing: several tests construct a real IBKRAdapter and drive
        # its order-building paths against a fake IB object, so the library
        # has to be importable even though nothing connects.
        #
        # This is the first thing CI found. The claim here used to be that
        # nothing in the suite needed a broker library, which was true only
        # because the development venv happened to have one installed.
        #
        # -c constraints.txt is the second thing it found, and the larger
        # one. requirements.txt asks for `>=` on everything, so without
        # constraints "install the dependencies" means "install whatever is
        # newest today" -- and the run that first got this far resolved
        # anyio 4.16 against 4.14 locally, starlette 1.10 against 1.3 and
        # fastapi 0.162 against 0.139, then hung until the job timed out.
        # CI has to install the set the suite is green on, or a red run says
        # nothing about the code.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run the test suite
        working-directory: hub
        # No TC_* environment and no .env, which is the point: the hub has to
        # start from its declared defaults. Anything that needs a token --
        # Flex, Schwab, the Operations hub reporter -- is inert without one,
        # and a test that only passed because this machine had a credential
        # would be a test that passes for the wrong reason.
        #
        # --timeout turns a hung test into a named failure. Without it, the
        # run that hung reported only that the job was cancelled twenty
        # minutes later, which says nothing about which test did it. 120s
        # against a slowest test of ~17s is seven times the headroom
        # locally and still several times it on a slower runner.
        #
        # --durations is how the next person notices the suite getting
        # slower before it gets slow enough to matter.
        run: >-
          python -m pytest tests/ -q -rf
          --timeout=120 --timeout-method=thread
          --durations=10

  ui:
    name: dashboard build
    # Linux, because this is a Vite build with nothing platform-specific in
    # it, and it is the cheaper runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        # There are no UI tests, so the build IS the check: it catches a
        # syntax error, a bad import or a component renamed on one side of a
        # change only -- which is most of what goes wrong in this dashboard,
        # and all of it currently found by opening the page by hand.
        run: npm run build

  latest-deps:
    name: upgrade canary
    # Never on a pull request, so a library released this morning cannot
    # block a merge. It answers "what breaks when we upgrade" BEFORE anyone
    # upgrades -- which is the question the pinned runs left open: two tests
    # failed under newer versions and the job was killed before pytest said
    # which two.
    #
    # Red here is information, not an outage. Nothing is blocked by it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the newest of everything
        working-directory: hub
        # No constraints file and no pins: the names come out of the pinned
        # files with the versions stripped off, so a dependency added to
        # requirements.txt is canaried automatically rather than being
        # forgotten in a second list kept here.
        #
        # This is the one job allowed to drift. Everything else installs the
        # set the suite is known to pass on.
        run: |
          python -m pip install --upgrade pip
          python scripts/unpin_requirements.py requirements.txt requirements-dev.txt > requirements-latest.txt
          Get-Content requirements-latest.txt
          python -m pip install --upgrade -r requirements-latest.txt

      - name: What it resolved to
        working-directory: hub
        # Printed before the suite runs, so a failure below can be read
        # against the versions that produced it. Without this the report is
        # "it broke on the newest of something".
        run: python -m pip list

      - name: Run the test suite
        working-directory: hub
        run: >-
          python -m pytest tests/ -q -rf
          --timeout=180 --timeout-method=thread
          --durations=10
