# nginx reverse proxy for the Global Trade Copier dashboard.
#
# Serves the built React app (ui/dist) as static files, and proxies the
# hub's REST + WebSocket API through to the FastAPI process on
# 127.0.0.1:8000. The proxied path list must match ui/vite.config.js's dev
# proxy exactly, or requests that work in `npm run dev` will 404 here.
#
# Install: copy to /etc/nginx/sites-available/tradecopier, symlink into
# sites-enabled, `nginx -t` to check syntax, then reload.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tradecopier
#   sudo ln -s /etc/nginx/sites-available/tradecopier /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS (needed for Schwab's OAuth redirect_uri in production, and for
# wss:// so the dashboard's WebSocket works over a public domain), run
# `sudo certbot --nginx -d your-domain` after this config is live -- it
# rewrites this file in place to add the TLS server block and the 80->443
# redirect. Not done here since it needs a real domain + DNS pointed at
# the VPS first.

upstream tradecopier_hub {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # replace with your domain once you have one

    root /opt/tradecopier/ui/dist;
    index index.html;

    # React Router client-side routing: serve index.html for any path that
    # isn't a real static file, so /settings etc. work on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # REST API -- must match the path list in ui/vite.config.js's dev proxy.
    location ~ ^/(slaves|trades|config|status|logs|risk|schwab|health) {
        proxy_pass http://tradecopier_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (live activity feed) -- needs the Upgrade headers and a
    # long read timeout since it's a long-lived connection, not a request.
    location /ws/ {
        proxy_pass http://tradecopier_hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
